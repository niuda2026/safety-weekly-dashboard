<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保险赔付补贴监控</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f4f8;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* 单行表头：高度与左侧导航LOGO区一致(约76px)，内容等比例放大 */
.topbar{background:linear-gradient(135deg,#0b1f4d,#123c7e 60%,#1e5cb3);color:#fff;padding:15px 26px;border-bottom:3px solid #0a1d3f;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 2px 8px rgba(11,31,77,.35)}
.tb-left{min-width:0}
.tb-left .t{font-weight:700;font-size:21px;line-height:1.3;white-space:nowrap}
.tb-left .sub{font-size:12.5px;opacity:.82;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.tabs{display:flex;gap:8px}
.tab{padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14.5px;background:rgba(255,255,255,.12);transition:.15s;border:1px solid transparent;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.22)}
.tab.active{background:#fff;color:#1e5cb3;font-weight:700}
.tab .cyc{font-size:12px;opacity:.75;font-weight:400;margin-left:6px}
.tab.active .cyc{color:#888}
.btn-shot{background:#fff;color:#1e5cb3;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn-shot:hover{background:#e8f0fe}
iframe{flex:1;border:none;width:100%;background:#fff}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-left">
    <div class="t">🛡️ 保险赔付补贴监控</div>
    <div class="sub" id="subLine">专送合作商骑手保障补贴考核方案 · 按指标加权得分率结算</div>
  </div>
  <div class="tb-right">
    <div class="tabs" id="tabs">
      <div class="tab" data-i="0">老版 · 补贴测算<span class="cyc">V2</span></div>
      <div class="tab active" data-i="1">保险 · 安全达成<span class="cyc">V3</span></div>
    </div>
    <button class="btn-shot" id="btnShot" onclick="shot()">📷 截图</button>
  </div>
</div>
<iframe id="frame"></iframe>

<script>
/* 两版看板文件（相对文件名，同目录） */
var files = {
  0: { local: "D:/兴达数据库/骑手保障补贴/insurance_subsidy_v2.html",
       rel:  "insurance_subsidy_v2.html",
       live: "insurance_subsidy_v2.html",
       sub:  "2025-09-01 ~ 2026-08-31 考核周期 · 专送合作商骑手保障补贴考核方案" },
  1: { local: "D:/兴达数据库/骑手保障补贴/专送合作商骑手保障补贴考核看板_2026_V3.html",
       rel:  "insurance_subsidy_v3.html",
       live: "/insurance-live/专送合作商骑手保障补贴考核看板_2026_V3.html",
       sub:  "专送合作商骑手保障补贴考核方案 · 按指标加权得分率结算 · MTPS-ZS-QB-V3-20260234 · 2026.09.01-2027.08.31（结算季度 2026 Q1）" }
};
var cur = 1;
function pick(i){
  cur = i;
  document.querySelectorAll(".tab").forEach(function(t,j){ t.classList.toggle("active", j===i); });
  document.getElementById("subLine").textContent = files[i].sub;
  document.getElementById("btnShot").style.display = (i===1) ? "" : "none";
  var f = files[i];
  var src;
  if (location.protocol === "file:") {
    src = "file:///" + f.local;
  } else if (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && f.live) {
    // 本地 8421：实时加载工作台保险分组真身 + 其最新数据文件（bi_data/latest.json 等）
    src = f.live;
  } else {
    // 公网/其他环境：用周报目录内的快照副本
    src = f.rel;
  }
  // 加时间戳防浏览器缓存旧版看板代码
  src += (src.indexOf("?")>=0 ? "&" : "?") + "t=" + Date.now();
  document.getElementById("frame").src = src;
}
/* ===== 截图：向看板发指令，拼上表头后交给门户页合成全页 ===== */
var __shotPending=false, __shotTimer=null, __shotGot=false;
function shotSet(on){
  var btn=document.getElementById("btnShot");
  if(!btn) return;
  if(on){ if(!btn.dataset.old) btn.dataset.old=btn.textContent; btn.textContent="⏳ 截图生成中…"; btn.disabled=true; }
  else { btn.textContent=btn.dataset.old||"📷 截图"; btn.disabled=false; }
}
function shotTip(t){ var btn=document.getElementById("btnShot"); if(btn && __shotPending) btn.textContent=t; }
function shotDone(){ clearTimeout(__shotTimer); __shotPending=false; shotSet(false); }
function shot(){
  if(__shotPending) return;
  var f=document.getElementById("frame");
  __shotPending=true; __shotGot=false; shotSet(true);
  try{ f.contentWindow.postMessage({type:"xd-v3-shot"},"*"); }catch(e){}
  try{ var w=f.contentWindow; if(w && typeof w.screenshot==="function") w.screenshot(); }catch(e){} // 旧版兜底
  __shotTimer=setTimeout(function(){
    if(!__shotGot){ shotDone(); alert("截图超时：看板未响应。\n请在页面按 Ctrl+F5 强制刷新后重试。"); }
  },25000);
  setTimeout(function(){ if(__shotPending) shotTip("⏳ 仍在处理…"); },5000);
}
function saveCanvas(cv,name){
  try{
    if(cv.toBlob){
      cv.toBlob(function(b){
        var url=URL.createObjectURL(b), a=document.createElement("a");
        a.href=url; a.download=name; document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },30000);
      },"image/png");
    }else{
      var a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){ alert("下载失败："+e.message); }
}
function ensureH2c(cb,tries){
  tries=tries||0;
  if(window.html2canvas){ cb(); return; }
  if(tries>40){ shotDone(); alert("截图库未加载：请检查网络（html2canvas CDN）后刷新重试"); return; }
  if(tries===0){
    var s=document.createElement("script");
    s.src="https://html2canvas.hertzen.com/dist/html2canvas.min.js";
    document.head.appendChild(s);
  }
  setTimeout(function(){ ensureH2c(cb,tries+1); },300);
}
window.addEventListener("message",function(ev){
  var d=ev.data||{};
  if(d.type!=="xd-v3-shot-done"||!__shotPending) return;
  __shotGot=true;
  shotTip("⏳ 拼合中…");
  ensureH2c(function(){
    var tb=document.querySelector(".topbar");
  html2canvas(tb,{scale:2,useCORS:true,backgroundColor:"#0b1f4d"}).then(function(topCv){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement("canvas");
      c.width=Math.max(topCv.width,img.width);
      c.height=topCv.height+img.height;
      var ctx=c.getContext("2d");
      ctx.fillStyle="#0b1f4d"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(topCv,Math.round((c.width-topCv.width)/2),0);
      ctx.drawImage(img,Math.round((c.width-img.width)/2),topCv.height);
      if(window.parent && window.parent!==window){
        window.parent.postMessage({type:"xd-shell-shot",dataUrl:c.toDataURL("image/png"),w:c.width/2,h:c.height/2},"*");
        shotDone();
      }else{
        saveCanvas(c,"保险赔付补贴监控_截图_"+Date.now()+".png");
        shotDone();
      }
    };
    img.onerror=function(){ shotDone(); alert("截图拼合失败，请重试"); };
    img.src=d.dataUrl;
  }).catch(function(e){ shotDone(); alert("截图失败："+(e&&e.message||e)); });
  });
});
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){ pick(+t.dataset.i); };
});
pick(cur);
</script>
</body>
</html>
